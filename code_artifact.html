<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>規約閲覧・編集レンダラー</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery 3.7.1 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Phosphor Icons (アイコン表示用) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="./css/code_artifact.css">
</head>
<body class="d-flex flex-column">

  <!-- ヘッダー -->
  <header class="app-header sticky-top shadow-sm">
    <div class="container-xl h-100 d-flex align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-3 min-w-0">
        <div class="app-logo-icon rounded-3 d-flex align-items-center justify-content-center shadow-sm flex-shrink-0">
          <i class="ph ph-scroll fs-4"></i>
        </div>
        <div class="text-truncate">
          <h1 id="top-title" class="app-title text-truncate">
            団地管理組合規約ビューア
          </h1>
        </div>
      </div>

      <!-- 操作ツールバー -->
      <div class="d-flex align-items-center gap-2 flex-shrink-0">
        <!-- JSON読み込みボタン -->
        <label class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1 mb-0">
          <i class="ph ph-file-arrow-up fs-5"></i>
          <span>規約の読込</span>
          <input type="file" id="json-file-input" accept=".json" class="d-none">
        </label>

        <!-- 目次切り替え（モバイル用 Offcanvas トリガー） -->
        <button class="btn btn-outline-secondary btn-sm d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">
          <i class="ph ph-list fs-5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- メインレイアウト -->
  <div class="container-xl py-4 flex-grow-1">
    <div class="row g-4">

      <!-- サイドバー: 自動生成ブックマーク目次 (デスクトップは常時表示、モバイルはOffcanvas) -->
      <aside class="col-lg-4 col-xl-3">
        <div class="offcanvas-lg offcanvas-start toc-sidebar-wrapper" tabindex="-1" id="sidebarOffcanvas" aria-labelledby="sidebarOffcanvasLabel">
          <div class="offcanvas-header d-lg-none border-bottom">
            <h5 class="offcanvas-title fw-bold" id="sidebarOffcanvasLabel">
              <i class="ph ph-bookmarks me-1"></i> 目次ナビゲーション
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarOffcanvas" aria-label="閉じる"></button>
          </div>
          <div class="offcanvas-body p-0 h-100">
            <div class="toc-card shadow-sm p-3 w-100">
              <div class="d-flex align-items-center justify-content-between pb-2 mb-2 border-bottom">
                <span class="toc-header-label d-flex align-items-center gap-1">
                  <i class="ph ph-bookmarks"></i> 目次ナビゲーション
                </span>
              </div>
              <div id="toc-container" class="toc-list pe-1">
                <!-- 目次が動的に生成されます -->
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 本文エリア -->
      <main class="col-lg-8 col-xl-9">
        <!-- 規約タイトルヘッダーカード -->
        <div class="bylaws-hero-card shadow-sm p-4 p-sm-5 mb-4">
          <div class="bylaws-hero-bg-icon">
            <i class="ph ph-scales"></i>
          </div>
          <h2 id="bylaws-title" class="bylaws-main-title mb-0">
            規約データを読み込み中...
          </h2>
        </div>

        <!-- 規約本文コンテナ（章・節・条・項・号が動的に追加） -->
        <div id="articles-container" class="d-flex flex-column gap-4">
          <!-- 動的レンダリングエリア -->
        </div>
      </main>

    </div>
  </div>

  <!-- コピー通知トースト (Bootstrap Toast) -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="copyToast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2">
          <i class="ph ph-check-circle text-success fs-5"></i>
          <span id="toast-text">リンクをコピーしました</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- jQuery & 描画ロジック -->
  <script src="./js/code_artifact.js"></script>
</body>
</html>
